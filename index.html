<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — ระบบฝากออมทรัพย์</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ADMIN LOGIN -->
<div id="adminLoginView" class="auth-wrap">
  <div class="card auth-card">
    <div class="brand">
      <div class="logo">👑</div>
      <h1>Admin Panel</h1>
      <div class="hint">ระบบจัดการหลังบ้าน</div>
    </div>
    <div style="padding:24px;">
      <div id="adminAlert"></div>
      <form id="adminLoginForm">
        <div class="form-group">
          <label>Username</label>
          <input type="text" name="Username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="Password" required autocomplete="current-password">
        </div>
        <button class="btn btn-primary btn-full" type="submit">
          <span class="btn-label">เข้าสู่ระบบ</span>
        </button>
      </form>
    </div>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanelView" style="display:none;">
  <div class="admin-header">
    <div>
      <h2 style="font-size:18px;">👑 Admin Panel</h2>
      <div style="font-size:12px; opacity:.8; margin-top:2px;">จัดการผู้ใช้ & สร้างรายงาน</div>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="adminLogout()" style="color:white; border-color:rgba(255,255,255,.3)">ออก</button>
  </div>
  <div class="admin-wrap">
    <div id="adminMainAlert"></div>

    <div class="card" style="margin-bottom:20px;">
      <div class="card-header" style="display:flex; justify-content:space-between; align-items:center;">
        <h2>⏳ รออนุมัติ</h2>
        <button class="btn btn-ghost btn-sm" onclick="loadPending()">↻ รีเฟรช</button>
      </div>
      <div style="overflow-x:auto;">
        <table class="admin-table" id="pendingTable">
          <thead><tr>
            <th>ชื่อเล่น</th><th>ชื่อ-สกุล</th><th>ชั้น</th><th>วันที่สมัคร</th><th>การจัดการ</th>
          </tr></thead>
          <tbody id="pendingBody"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="card-header" style="display:flex; justify-content:space-between; align-items:center;">
        <h2>👥 ผู้ใช้ทั้งหมด</h2>
        <button class="btn btn-ghost btn-sm" onclick="loadAllUsers()">↻ รีเฟรช</button>
      </div>
      <div style="overflow-x:auto;">
        <table class="admin-table" id="allUsersTable">
          <thead><tr>
            <th>ชื่อเล่น</th><th>ชื่อ-สกุล</th><th>สถานะ</th><th>หมดอายุ</th><th>การจัดการ</th>
          </tr></thead>
          <tbody id="allUsersBody"></tbody>
        </table>
      </div>
    </div>

    <div class="card" style="margin-top:20px;">
      <div class="card-header">
        <h2>📄 รายงาน (PDF/JPG) ใน Drive</h2>
      </div>
      <div class="card-body">
        <p style="font-size:13px; color:#6b7685; margin-bottom:12px;">
          ไฟล์รายงานจะถูกสร้างในโฟลเดอร์ Drive ที่ตั้งค่าไว้ — เดือนละ 1 ไฟล์ ต่อผู้ใช้
        </p>
        <div id="reportsList" style="font-size:13px;"></div>
      </div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
const $ = s => document.querySelector(s);
const AUTH_KEY = 'saving_admin_token';
const saveToken = t => localStorage.setItem(AUTH_KEY, t);
const getToken = () => localStorage.getItem(AUTH_KEY) || '';
const clearToken = () => localStorage.removeItem(AUTH_KEY);

function showAlert(sel, type, msg) {
  $(sel).innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
  setTimeout(() => { $(sel).innerHTML = ''; }, 5000);
}

async function api(action, payload = {}, token = '') {
  const res = await fetch(window.APP_CONFIG.API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, payload, token }),
    redirect: 'follow',
  });
  return res.json();
}

/* Login */
$('#adminLoginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const btn = e.target.querySelector('button');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  try {
    const r = await api('adminLogin', { Username: fd.get('Username'), Password: fd.get('Password') });
    if (r.ok) {
      saveToken(r.token);
      showPanel();
      loadPending();
      loadAllUsers();
      loadReports();
    } else {
      showAlert('#adminAlert', 'error', r.error || 'เกิดข้อผิดพลาด');
    }
  } catch (err) { showAlert('#adminAlert', 'error', err.message); }
  finally { btn.disabled = false; btn.innerHTML = '<span class="btn-label">เข้าสู่ระบบ</span>'; }
});

function showPanel() {
  $('#adminLoginView').style.display = 'none';
  $('#adminPanelView').style.display = 'block';
}

function adminLogout() {
  clearToken();
  $('#adminLoginView').style.display = 'flex';
  $('#adminPanelView').style.display = 'none';
}

/* Pending */
async function loadPending() {
  try {
    const r = await api('adminGetPending', {}, getToken());
    const tbody = $('#pendingBody');
    if (!r.ok) return showAlert('#adminMainAlert', 'error', r.error);
    if (!r.pending.length) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#6b7685; padding:24px;">ไม่มีรายการรออนุมัติ</td></tr>`;
      return;
    }
    tbody.innerHTML = r.pending.map(u => `
      <tr>
        <td><b>${u.nickname}</b></td>
        <td>${u.firstName} ${u.lastName}</td>
        <td>${u.grade}</td>
        <td style="font-size:12px; color:#6b7685;">${u.registeredDate}</td>
        <td>
          <button class="btn btn-success btn-sm" onclick="approve('${u.userId}')">✓ อนุมัติ</button>
          <button class="btn btn-danger btn-sm" onclick="reject('${u.userId}')">✗ ปฏิเสธ</button>
        </td>
      </tr>
    `).join('');
  } catch (e) { showAlert('#adminMainAlert', 'error', e.message); }
}

async function approve(id) {
  if (!confirm('อนุมัติผู้ใช้นี้ และสร้างสมุดบัญชีอัตโนมัติ?')) return;
  try {
    const r = await api('adminApprove', { userId: id }, getToken());
    if (r.ok) {
      showAlert('#adminMainAlert', 'success', '✅ อนุมัติแล้ว — สร้างชีต: ' + r.sheetName);
      loadPending(); loadAllUsers();
    } else {
      showAlert('#adminMainAlert', 'error', r.error);
    }
  } catch (e) { showAlert('#adminMainAlert', 'error', e.message); }
}

async function reject(id) {
  if (!confirm('ปฏิเสธผู้ใช้นี้?')) return;
  try {
    const r = await api('adminReject', { userId: id }, getToken());
    if (r.ok) { showAlert('#adminMainAlert', 'success', 'ปฏิเสธแล้ว'); loadPending(); loadAllUsers(); }
    else showAlert('#adminMainAlert', 'error', r.error);
  } catch (e) { showAlert('#adminMainAlert', 'error', e.message); }
}

/* All users */
async function loadAllUsers() {
  try {
    const r = await api('adminGetAllUsers', {}, getToken());
    if (!r.ok) return;
    const tbody = $('#allUsersBody');
    const badgeMap = { Pending:'pending', Approved:'approved', Rejected:'rejected', Closed:'closed' };
    const labelMap = { Pending:'รออนุมัติ', Approved:'อนุมัติ', Rejected:'ปฏิเสธ', Closed:'ปิดบัญชี' };
    tbody.innerHTML = r.users.map(u => `
      <tr>
        <td><b>${u.nickname}</b></td>
        <td>${u.firstName} ${u.lastName}</td>
        <td><span class="badge badge-${badgeMap[u.status]}">${labelMap[u.status] || u.status}</span></td>
        <td style="font-size:12px;">${u.expiry || '-'}</td>
        <td>
          ${u.status === 'Approved' ? `
            <button class="btn btn-primary btn-sm" onclick="genReport('${u.userId}')">📄 สร้างรายงาน</button>
          ` : '-'}
        </td>
      </tr>
    `).join('');
  } catch (e) { console.error(e); }
}

async function genReport(id) {
  if (!confirm('สร้างรายงาน PDF/JPG 12 เดือนสำหรับผู้ใช้นี้? (อาจใช้เวลาสักครู่)')) return;
  showAlert('#adminMainAlert', 'info', '⏳ กำลังสร้างรายงาน... อาจใช้เวลา 1-2 นาที');
  try {
    const r = await api('adminGenerateReport', { userId: id }, getToken());
    if (r.ok) {
      showAlert('#adminMainAlert', 'success', '✅ สร้างเสร็จ: ' + r.result.filter(x=>!x.error).length + ' เดือน');
      loadReports();
    } else {
      showAlert('#adminMainAlert', 'error', r.error);
    }
  } catch (e) { showAlert('#adminMainAlert', 'error', e.message); }
}

async function loadReports() {
  try {
    const r = await api('adminGetReports', {}, getToken());
    if (!r.ok) return;
    $('#reportsList').innerHTML = r.files.length ? r.files.map(f =>
      `<div style="padding:6px 0; border-bottom:1px solid #eee;">
        <a href="${f.url}" target="_blank" style="color:var(--primary); text-decoration:none;">${f.name}</a>
      </div>`
    ).join('') : '<div style="color:#6b7685;">ยังไม่มีไฟล์รายงาน</div>';
  } catch (e) { console.error(e); }
}

/* Boot */
(async function() {
  if (getToken()) {
    // token exists but session may be expired; try to load pending
    try {
      const r = await api('adminGetPending', {}, getToken());
      if (r.ok) { showPanel(); loadPending(); loadAllUsers(); loadReports(); }
      else { clearToken(); }
    } catch (e) { clearToken(); }
  }
})();
</script>
</body>
</html>
