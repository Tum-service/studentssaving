<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมุดฝากออมทรัพย์ - โรงเรียนบ้านถิ่นสำราญ</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #1a3d6d; --accent: #c9a961; --success: #0f7b4a; --danger: #b3261e; --bg: #f4f6f9; --card: #fff; --border: #e1e6ed; --text: #1a2332; --muted: #6b7685; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Sarabun', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .app-header { background: linear-gradient(135deg, var(--primary), #0e2746); color: #fff; padding: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 12px rgba(0,0,0,.1); }
    .container { max-width: 800px; margin: 0 auto; padding: 20px 16px; }
    .card { background: var(--card); border-radius: 12px; box-shadow: 0 2px 8px rgba(26,61,109,.08); border: 1px solid var(--border); overflow: hidden; margin-bottom: 20px; }
    .auth-wrap { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 80px); padding: 20px; }
    .auth-card { width: 100%; max-width: 400px; }
    .brand { text-align: center; padding: 24px; border-bottom: 3px solid var(--accent); }
    .form-group { margin-bottom: 16px; padding: 0 24px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border: 1.5px solid var(--border); border-radius: 8px; font-family: inherit; }
    .btn { display: flex; justify-content: center; padding: 12px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-family: inherit; transition: .2s; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { opacity: .9; }
    .btn-ghost { background: transparent; color: var(--primary); border: 1.5px solid var(--border); }
    .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    
    /* Passbook Styles */
    .passbook-hero { background: linear-gradient(135deg, var(--primary), #2c5a99); color: #fff; padding: 24px; display: flex; justify-content: space-between; align-items: center; }
    .passbook-hero .balance-value { font-size: 32px; font-weight: 800; color: var(--accent); }
    
    .txn-table { width: 100%; border-collapse: collapse; }
    .txn-table th { background: var(--primary); color: #fff; padding: 12px; text-align: center; font-size: 13px; font-weight: 600; }
    .txn-table td { padding: 12px; border-bottom: 1px solid var(--border); font-size: 15px; text-align: center; }
    .txn-table tr:hover { background-color: #f8faff; }
    .txn-table .num { text-align: right; font-variant-numeric: tabular-nums; }
    .txn-table .deposit { color: var(--success); font-weight: 600; }
    .txn-table .withdraw { color: var(--danger); font-weight: 600; }
    .txn-table .balance { font-weight: 700; color: var(--primary); }
    
    .alert { padding: 12px; border-radius: 8px; margin: 0 24px 16px; font-size: 14px; }
    .alert-error { background: #fee; color: var(--danger); }
    .alert-success { background: #e8f5ec; color: var(--success); }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; }
    .badge-pending { background: #fff4e0; color: #b76e00; }
    .badge-approved { background: #e8f5ec; color: var(--success); }
    .badge-closed { background: #eee; color: var(--muted); }
    .hidden { display: none !important; }
    
    /* ===== CSS สำหรับ Dropdown แอดมิน ===== */
    .admin-dropdown { position: relative; display: inline-block; }
    .dropdown-content {
      display: none; position: absolute; right: 0; top: 100%;
      background-color: var(--card); min-width: 180px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      z-index: 1000; border-radius: 8px; overflow: hidden; margin-top: 8px;
      border: 1px solid var(--border);
    }
    .dropdown-content a {
      color: var(--text); padding: 12px 16px; text-decoration: none;
      display: block; font-size: 14px; font-weight: 600;
    }
    .dropdown-content a:hover { background-color: #f1f1f1; color: var(--primary); }
    .show-dropdown { display: block !important; }
  </style>
</head>
<body>

  <!-- ================= MAIN HEADER ================= -->
  <header class="app-header">
    <div>
      <h1>🏦 สมุดฝากออมทรัพย์</h1>
      <div style="font-size:12px; opacity:.8">โรงเรียนบ้านถิ่นสำราญ</div>
    </div>
    
    <div style="display:flex; align-items:center; gap:12px;">
      <!-- ส่วนของผู้ใช้ทั่วไป -->
      <div id="headerUser" class="hidden" style="align-items:center; gap:12px;">
        <span id="headerName" style="font-size:14px;"></span>
        <button class="btn btn-ghost" onclick="logout()" style="color:#fff; border-color:rgba(255,255,255,.3); padding:6px 12px; font-size:12px;">ออก</button>
      </div>
      
      <!-- ส่วนของแอดมิน (เมื่อล็อคอินแล้ว) -->
      <div id="headerAdmin" class="hidden" style="align-items:center; gap:12px;">
        <span style="font-size:14px;">👑 Admin Panel</span>
        <button class="btn btn-ghost" onclick="adminLogout()" style="color:#fff; border-color:rgba(255,255,255,.3); padding:6px 12px; font-size:12px;">ออก</button>
      </div>

      <!-- ✅ ปุ่ม Dropdown แอดมิน (มุมขวาบน) -->
      <div class="admin-dropdown">
        <button class="btn btn-ghost" onclick="toggleAdminDropdown(event)" style="color:#fff; border-color:rgba(255,255,255,.3); padding:6px 10px; font-size:16px;">⚙️</button>
        <div id="adminDropdownMenu" class="dropdown-content">
          <a href="#" onclick="showAdminLogin(); toggleAdminDropdown(event)">🔑 เข้าสู่ระบบแอดมิน</a>
        </div>
      </div>
    </div>
  </header>

  <!-- ================= USER: AUTH VIEW ================= -->
  <div id="authView" class="auth-wrap hidden">
    <div class="card auth-card">
      <div class="brand"><h1>ระบบออมทรัพย์</h1></div>
      <div class="tabs">
        <div class="tab active" data-tab="login">เข้าสู่ระบบ</div>
        <div class="tab" data-tab="register">สมัครสมาชิก</div>
      </div>
      <div id="authAlert"></div>
      <form id="loginForm">
        <div class="form-group"><label>ชื่อเล่น</label><input type="text" name="Nickname" required></div>
        <div class="form-group"><label>รหัสผ่าน</label><input type="password" name="Password" required></div>
        <div class="form-group"><button type="submit" class="btn btn-primary"><span class="btn-label">เข้าสู่ระบบ</span></button></div>
      </form>
      <form id="registerForm" class="hidden">
        <div class="form-group"><label>ชื่อเล่น</label><input type="text" name="Nickname" required></div>
        <div class="form-group"><label>ชื่อ</label><input type="text" name="FirstName" required></div>
        <div class="form-group"><label>นามสกุล</label><input type="text" name="LastName" required></div>
        
        <div class="form-group">
          <label>ชั้น</label>
          <select name="Grade" required>
            <option value="">-- เลือกชั้น --</option>
            <option value="อ.1">อนุบาล 1</option>
            <option value="อ.2">อนุบาล 2</option>
            <option value="อ.3">อนุบาล 3</option>
            <option value="ป.1">ประถมศึกษาปีที่ 1</option>
            <option value="ป.2">ประถมศึกษาปีที่ 2</option>
            <option value="ป.3">ประถมศึกษาปีที่ 3</option>
            <option value="ป.4">ประถมศึกษาปีที่ 4</option>
            <option value="ป.5">ประถมศึกษาปีที่ 5</option>
            <option value="ป.6">ประถมศึกษาปีที่ 6</option>
            <option value="ม.1">มัธยมศึกษาปีที่ 1</option>
            <option value="ม.2">มัธยมศึกษาปีที่ 2</option>
            <option value="ม.3">มัธยมศึกษาปีที่ 3</option>
          </select>
        </div>

        <div class="form-group"><label>รหัสผ่าน</label><input type="password" name="Password" required></div>
        <div class="form-group"><button type="submit" class="btn btn-primary"><span class="btn-label">สมัครสมาชิก</span></button></div>
      </form>
    </div>
  </div>

  <!-- ================= USER: PASSBOOK VIEW ================= -->
  <div id="passbookView" class="container hidden">
    <div class="card">
      <!-- Header แสดงเฉพาะชื่อ และ ยอดคงเหลือ -->
      <div class="passbook-hero">
        <div>
          <h2 id="pbName" style="font-size:22px;"></h2>
          <div id="pbGrade" style="font-size:14px; opacity:.8; margin-top:4px;"></div>
        </div>
        <div style="text-align:right">
          <div style="font-size:14px; opacity:.8; margin-bottom:4px;">ยอดคงเหลือ</div>
          <div class="balance-value" id="pbBalance">0.00</div>
        </div>
      </div>
      
      <div style="padding:12px 16px; background:#fafbfc; font-size:12px; display:flex; justify-content:space-between; border-bottom:1px solid var(--border);">
        <span style="color:var(--muted);">อัปเดตล่าสุด: <span id="pbUpdated"></span></span>
        <button class="btn btn-ghost" onclick="loadPassbook()" style="padding:4px 12px; font-size:12px; border-radius:4px;">↻ รีเฟรช</button>
      </div>
      
      <div style="overflow-x:auto;">
        <table class="txn-table">
          <thead>
            <tr>
              <th width="25%">วันที่</th>
              <th width="25%" class="num" style="text-align:center;">ฝาก</th>
              <th width="25%" class="num" style="text-align:center;">ถอน</th>
              <th width="25%" class="num" style="text-align:center;">คงเหลือ</th>
            </tr>
          </thead>
          <tbody id="txnBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ================= ADMIN: LOGIN VIEW ================= -->
  <div id="adminLoginView" class="auth-wrap hidden">
    <div class="card auth-card">
      <div class="brand"><h1>👑 Admin Login</h1></div>
      <div id="adminAuthAlert"></div>
      <form id="adminLoginForm">
        <div class="form-group"><label>Username</label><input type="text" name="Username" required></div>
        <div class="form-group"><label>Password</label><input type="password" name="Password" required></div>
        <div class="form-group"><button type="submit" class="btn btn-primary"><span class="btn-label">เข้าสู่ระบบ</span></button></div>
      </form>
    </div>
  </div>

  <!-- ================= ADMIN: PANEL VIEW ================= -->
  <div id="adminPanelView" class="container hidden">
    <div id="adminMainAlert"></div>
    <div class="card">
      <div style="padding:16px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between;">
        <h2>⏳ รออนุมัติ</h2><button class="btn btn-ghost" onclick="adminLoadPending()" style="padding:4px 8px;">↻</button>
      </div>
      <table class="txn-table"><thead><tr><th>ชื่อเล่น</th><th>ชื่อ-สกุล</th><th>จัดการ</th></tr></thead><tbody id="adminPendingBody"></tbody></table>
    </div>
    <div class="card">
      <div style="padding:16px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between;">
        <h2>👥 ผู้ใช้ทั้งหมด</h2><button class="btn btn-ghost" onclick="adminLoadUsers()" style="padding:4px 8px;">↻</button>
      </div>
      <table class="txn-table"><thead><tr><th>ชื่อเล่น</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody id="adminUsersBody"></tbody></table>
    </div>
  </div>

  <script>
    // ============ CONFIG ============
    // 🟢 เพิ่ม Cache Buster (?v=...) เพื่อบังคับให้ดึงข้อมูลใหม่เสมอ ไม่ติด Cache
    const API_URL = 'https://script.google.com/macros/s/AKfycbzXi6lTn7cPrlC-z9bOjsJORhgsBM-ymIj2vjfh8O03h79rV8QhM03cEJGpey110d58/exec';
    const USER_TOKEN_KEY = 'saving_auth_token';
    const ADMIN_TOKEN_KEY = 'saving_admin_token';
    const $ = s => document.querySelector(s);
    const $$ = s => document.querySelectorAll(s);

    // ============ UTILS ============
    function showAlert(sel, type, msg) { 
      const el = $(sel); if(!el) return;
      el.innerHTML = `<div class="alert alert-${type}">${msg}</div>`; 
      setTimeout(() => { el.innerHTML = ''; }, 5000); 
    }
    function fmt(n) { return Number(n || 0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    
    async function api(action, payload = {}, token = '') {
      // ใส่ timestamp ต่อท้าย URL ป้องกัน Browser Cache
      const url = API_URL + '?t=' + new Date().getTime();
      const res = await fetch(url, {
        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, payload, token }), redirect: 'follow',
      });
      return res.json();
    }
    
    function hideAllViews() {
      ['authView', 'passbookView', 'adminLoginView', 'adminPanelView'].forEach(id => $('#'+id).classList.add('hidden'));
      $('#headerUser').classList.add('hidden');
      $('#headerAdmin').classList.add('hidden');
    }

    // ============ ADMIN DROPDOWN MENU ============
    function toggleAdminDropdown(event) {
      if (event) event.stopPropagation();
      document.getElementById("adminDropdownMenu").classList.toggle("show-dropdown");
    }

    window.addEventListener('click', function(event) {
      const dropdown = document.getElementById("adminDropdownMenu");
      if (dropdown && dropdown.classList.contains('show-dropdown')) {
        if (!event.target.closest('.admin-dropdown')) {
          dropdown.classList.remove('show-dropdown');
        }
      }
    });

    // ============ USER AUTH ============
    $$('.tab').forEach(tab => tab.addEventListener('click', () => {
      $$('.tab').forEach(t => t.classList.remove('active')); tab.classList.add('active');
      $('#loginForm').classList.toggle('hidden', tab.dataset.tab !== 'login');
      $('#registerForm').classList.toggle('hidden', tab.dataset.tab !== 'register');
    }));

    $('#registerForm').addEventListener('submit', async (e) => {
      e.preventDefault(); const fd = new FormData(e.target); const btn = e.target.querySelector('button');
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
      try {
        const r = await api('register', { Nickname: fd.get('Nickname'), FirstName: fd.get('FirstName'), LastName: fd.get('LastName'), Grade: fd.get('Grade'), Password: fd.get('Password') });
        if (r.ok) { showAlert('#authAlert', 'success', r.message); setTimeout(() => document.querySelector('[data-tab="login"]').click(), 2000); }
        else showAlert('#authAlert', 'error', r.error);
      } catch (err) { showAlert('#authAlert', 'error', err.message); }
      finally { btn.disabled = false; btn.innerHTML = '<span class="btn-label">สมัครสมาชิก</span>'; }
    });

    $('#loginForm').addEventListener('submit', async (e) => {
      e.preventDefault(); const fd = new FormData(e.target); const btn = e.target.querySelector('button');
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
      try {
        const r = await api('login', { Nickname: fd.get('Nickname'), Password: fd.get('Password') });
        if (r.ok) { localStorage.setItem(USER_TOKEN_KEY, r.token); loadPassbook(); }
        else showAlert('#authAlert', 'error', r.error);
      } catch (err) { showAlert('#authAlert', 'error', err.message); }
      finally { btn.disabled = false; btn.innerHTML = '<span class="btn-label">เข้าสู่ระบบ</span>'; }
    });

    async function loadPassbook() {
      try {
        const r = await api('getTransactions', {}, localStorage.getItem(USER_TOKEN_KEY) || '');
        if (!r.ok) { 
          if (/Unauthorized|ปิด/.test(r.error)) { 
            localStorage.removeItem(USER_TOKEN_KEY); 
            showAuth(); 
            showAlert('#authAlert', 'error', r.error); 
          } 
          return; 
        }
        
        hideAllViews();
        $('#passbookView').classList.remove('hidden'); 
        $('#headerUser').classList.remove('hidden');
        
        // อัปเดตข้อมูลส่วนตัว
        $('#headerName').textContent = r.user.nickname;
        $('#pbName').textContent = r.user.firstName + ' ' + r.user.lastName;
        $('#pbGrade').textContent = 'ชั้น ' + r.user.grade;
        
        // 🟢 คำนวณยอดคงเหลือแบบสะสมใหม่ (Running Balance) ตั้งแต่แถวแรกสุด
        // เพื่อให้ได้ยอดที่ถูกต้อง 100% ไม่ว่าใน Sheet สูตรจะเพี้ยนหรือไม่
        let runningBalance = 0;
        if (r.transactions.length > 0) {
            // เอายอดยกมาของแถวแรกสุดเป็นจุดเริ่มต้น (ถ้ามี)
            runningBalance = r.transactions[0].prevBalance || 0;
        }
        
        r.transactions.forEach(t => {
            runningBalance += t.deposit;
            runningBalance -= t.withdraw;
            runningBalance -= t.transfer; // หักยอดโอนออก
            t.calculatedBalance = runningBalance;
        });

        // อัปเดตยอดคงเหลือล่าสุดด้านบน
        if (r.transactions.length > 0) {
            // รายการสุดท้ายคือล่าสุด
            $('#pbBalance').textContent = fmt(r.transactions[r.transactions.length - 1].calculatedBalance);
        } else {
            $('#pbBalance').textContent = fmt(0);
        }
        
        // สร้างตารางรายการ (ย้อนกลับจากใหม่ไปเก่า โดยใช้ยอด calculatedBalance ที่คำนวณใหม่)
        $('#txnBody').innerHTML = r.transactions.length ? r.transactions.reverse().map(t => {
          const depText = t.deposit > 0 ? '+' + fmt(t.deposit) : '-';
          const witText = t.withdraw > 0 ? '-' + fmt(t.withdraw) : '-';
          
          return `
          <tr>
            <td>${t.date}</td>
            <td class="num deposit">${depText}</td>
            <td class="num withdraw">${witText}</td>
            <td class="num balance">${fmt(t.calculatedBalance)}</td>
          </tr>`;
        }).join('') : '<tr><td colspan="4" style="text-align:center; padding: 30px; color: #999;">ยังไม่มีรายการฝาก-ถอน</td></tr>';
        
        $('#pbUpdated').textContent = new Date().toLocaleTimeString('th-TH');
      } catch (e) { console.error(e); }
    }
    
    function showAuth() { hideAllViews(); $('#authView').classList.remove('hidden'); }
    function logout() { localStorage.removeItem(USER_TOKEN_KEY); showAuth(); }

    // ============ ADMIN AUTH & PANEL ============
    function showAdminLogin() { hideAllViews(); $('#adminLoginView').classList.remove('hidden'); }
    
    $('#adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault(); const fd = new FormData(e.target); const btn = e.target.querySelector('button');
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
      try {
        const r = await api('adminLogin', { Username: fd.get('Username'), Password: fd.get('Password') });
        if (r.ok) { localStorage.setItem(ADMIN_TOKEN_KEY, r.token); showAdminPanel(); }
        else showAlert('#adminAuthAlert', 'error', r.error);
      } catch (err) { showAlert('#adminAuthAlert', 'error', err.message); }
      finally { btn.disabled = false; btn.innerHTML = '<span class="btn-label">เข้าสู่ระบบ</span>'; }
    });

    function showAdminPanel() {
      hideAllViews();
      $('#adminPanelView').classList.remove('hidden'); $('#headerAdmin').classList.remove('hidden');
      adminLoadPending(); adminLoadUsers();
    }
    
    function adminLogout() { localStorage.removeItem(ADMIN_TOKEN_KEY); showAuth(); }

    async function adminLoadPending() {
      const token = localStorage.getItem(ADMIN_TOKEN_KEY);
      const r = await api('adminGetPending', {}, token); const tbody = $('#adminPendingBody');
      if (!r.pending || !r.pending.length) return tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">ไม่มีรายการ</td></tr>';
      tbody.innerHTML = r.pending.map(u => `<tr><td>${u.nickname}</td><td>${u.firstName} ${u.lastName}</td>
        <td><button class="btn btn-primary" style="padding:4px 8px; font-size:12px;" onclick="adminApprove('${u.userId}')">อนุมัติ</button></td></tr>`).join('');
    }
    
    async function adminLoadUsers() {
      const token = localStorage.getItem(ADMIN_TOKEN_KEY);
      const r = await api('adminGetAllUsers', {}, token); const tbody = $('#adminUsersBody');
      tbody.innerHTML = r.users.map(u => `<tr><td>${u.nickname}</td><td><span class="badge badge-${u.status.toLowerCase()}">${u.status}</span></td>
        <td>${u.status === 'Approved' ? `<button class="btn btn-ghost" style="padding:4px 8px; font-size:12px;" onclick="adminGenReport('${u.userId}')">📄 สร้างรายงาน</button>` : '-'}</td></tr>`).join('');
    }
    
    async function adminApprove(id) { 
      if(!confirm('อนุมัติ?')) return; const token = localStorage.getItem(ADMIN_TOKEN_KEY);
      const r = await api('adminApprove', { userId: id }, token); 
      if(r.ok) { showAlert('#adminMainAlert', 'success', 'อนุมัติสำเร็จ'); adminLoadPending(); adminLoadUsers(); } 
      else showAlert('#adminMainAlert', 'error', r.error); 
    }
    
    async function adminGenReport(id) { 
      if(!confirm('สร้าง PDF/JPG 12 เดือน?')) return; const token = localStorage.getItem(ADMIN_TOKEN_KEY);
      showAlert('#adminMainAlert', 'success', 'กำลังสร้างรายงาน...'); 
      await api('adminGenerateReport', { userId: id }, token); 
      showAlert('#adminMainAlert', 'success', 'สร้างเสร็จสิ้น'); 
    }

    // ============ INIT ============
    (function init() {
      if (localStorage.getItem(USER_TOKEN_KEY)) {
        loadPassbook().catch(() => { localStorage.removeItem(USER_TOKEN_KEY); showAuth(); });
      } else if (localStorage.getItem(ADMIN_TOKEN_KEY)) {
        showAdminPanel();
      } else {
        showAuth();
      }
    })();
  </script>
</body>
</html>
